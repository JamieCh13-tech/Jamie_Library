<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambridge English · Jamie's Library</title>
<style>
  :root{
    --sky1:#bfe6ff; --sky2:#eaf7ff; --cream:#fff8ec; --navy:#1d3557;
    --red:#d62828; --grass:#7cc36a; --road:#5b6270; --ink:#24324a;
    --starters:#43b85c; --movers:#f2a417; --flyers:#2f9be0; --ket:#8a5cd6; --pet:#e0457b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 260px,var(--cream) 520px);
    overflow-x:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .wrap{max-width:980px;margin:0 auto;padding:0 16px 60px}

  /* ---------- top bar ---------- */
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 0 0;position:relative;z-index:3}
  .pill{
    display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;
    padding:8px 14px;font-weight:700;font-size:15px;color:var(--navy);text-decoration:none;
    box-shadow:0 3px 0 rgba(29,53,87,.18);transition:transform .15s;
  }
  .pill:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(29,53,87,.18)}
  .pill .ic{font-size:18px}

  /* ---------- London scene ---------- */
  .scene{position:relative;height:190px;margin-top:-10px;pointer-events:none}
  .scene svg.bg{position:absolute;inset:0;width:100%;height:100%}
  .bus{position:absolute;bottom:2px;height:auto;left:-140px;width:120px;animation:drive 14s linear infinite}
  @keyframes drive{0%{left:-140px}100%{left:calc(100% + 20px)}}
  .bus .wheel{transform-origin:center;transform-box:fill-box;animation:spin .6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .cloud{animation:float 9s ease-in-out infinite alternate}
  @keyframes float{to{transform:translateX(30px)}}

  .title{text-align:center;margin:6px 0 4px}
  .title h1{
    font-size:clamp(30px,6vw,46px);color:var(--red);letter-spacing:1px;
    text-shadow:3px 3px 0 #fff, 5px 5px 0 rgba(29,53,87,.15);
  }
  .bunting{display:flex;justify-content:center;gap:4px;margin:2px 0 14px}
  .bunting span{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:16px solid}
  .bunting span:nth-child(3n+1){border-top-color:var(--red)}
  .bunting span:nth-child(3n+2){border-top-color:#fff}
  .bunting span:nth-child(3n){border-top-color:var(--navy)}

  /* ---------- search ---------- */
  .search{
    display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;
    padding:10px 18px;max-width:520px;margin:0 auto 22px;
    box-shadow:0 4px 0 rgba(29,53,87,.15);border:3px solid var(--navy);
  }
  .search span{font-size:20px}
  .search input{flex:1;border:none;outline:none;font-size:17px;font-family:inherit;background:transparent;color:var(--ink)}
  .search button{font-size:18px;opacity:.5}

  /* ---------- level doors (home) ---------- */
  .levels{
    display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:end;
    padding:20px 0 0;position:relative;
  }
  .levels::after{ /* road */
    content:"";position:absolute;left:-16px;right:-16px;bottom:-26px;height:22px;background:var(--road);
    border-top:4px solid var(--grass);
    background-image:repeating-linear-gradient(90deg,transparent 0 26px,#f6d743 26px 50px);
    background-size:100% 4px;background-repeat:repeat-x;background-position:0 9px;
    background-color:var(--road);z-index:-1;
  }
  .level{
    --c:#999;
    position:relative;background:#fff;border-radius:22px 22px 14px 14px;
    padding:16px 8px 14px;text-align:center;
    border:4px solid var(--c);box-shadow:0 6px 0 var(--c);
    transition:transform .18s;
  }
  .level:hover{transform:translateY(-6px)}
  .level:active{transform:translateY(2px);box-shadow:0 2px 0 var(--c)}
  .level:nth-child(2){margin-bottom:24px}
  .level:nth-child(3){margin-bottom:48px}
  .level:nth-child(4){margin-bottom:72px}
  .level:nth-child(5){margin-bottom:96px}
  .level .emo{font-size:52px;line-height:1.1;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.08))}
  .level .name{display:block;font-size:20px;font-weight:800;color:var(--c);margin-top:6px}
  .level .stars{display:block;font-size:12px;margin-top:4px;letter-spacing:1px}
  .level .cefr{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;color:#fff;background:var(--c);border-radius:999px;padding:2px 9px}
  .level .count{
    position:absolute;top:-12px;right:-10px;min-width:30px;height:30px;border-radius:50%;
    background:var(--red);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;
    border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.2);padding:0 4px;
  }
  .level .count:empty{display:none}
  .road-space{height:40px}

  /* ---------- level page ---------- */
  .lvl-head{
    --c:#999;display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;
    padding:14px 18px;border:4px solid var(--c);box-shadow:0 6px 0 var(--c);margin:0 0 26px;
  }
  .lvl-head .emo{font-size:54px;line-height:1}
  .lvl-head h2{font-size:30px;color:var(--c)}
  .lvl-head .stars{font-size:14px}
  .lvl-head .cefr{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:#fff;background:var(--c);border-radius:999px;padding:2px 10px;vertical-align:middle}

  .shelf{margin-bottom:26px}
  .shelf-label{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--navy);margin:0 0 8px 4px}
  .shelf-label .ic{font-size:26px}
  .row{
    display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;
    padding:14px 12px 0;
    background:linear-gradient(180deg,transparent calc(100% - 18px),#b07a45 calc(100% - 18px),#8d5d31 100%);
    border-radius:0 0 8px 8px;scrollbar-width:thin;
  }
  .row::-webkit-scrollbar{height:6px}
  .row::-webkit-scrollbar-thumb{background:#c9a27b;border-radius:3px}

  /* ---------- London door (one item) ---------- */
  .door{
    --d:#2f9be0;
    flex:0 0 calc(50% - 8px);max-width:190px;scroll-snap-align:start;
    display:flex;flex-direction:column;align-items:center;padding-bottom:18px;
    transition:transform .18s;
  }
  .door:hover{transform:translateY(-5px)}
  .door:active{transform:scale(.97)}
  .door .frame{
    position:relative;width:100%;aspect-ratio:3/4.2;background:#fff;
    border-radius:999px 999px 6px 6px;padding:8px 8px 0;
  }
  .door .fan{ /* arched window */
    height:22%;border-radius:999px 999px 0 0;
    background:
      repeating-conic-gradient(from -90deg at 50% 100%, #fff 0 4deg, #bfe6ff 4deg 30deg);
    border:5px solid #fff;
  }
  .door .leaf{
    position:relative;height:78%;background:var(--d);border-radius:4px 4px 0 0;
    display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:9px;padding:12px 12px 14px;
  }
  .door .leaf i{border:3px solid rgba(0,0,0,.14);border-radius:3px}
  .door .knob{position:absolute;right:11px;top:52%;width:11px;height:11px;border-radius:50%;background:#f6d743;box-shadow:0 1px 0 rgba(0,0,0,.25)}
  .door .num{ /* brass number plate = several quizzes */
    position:absolute;left:50%;top:6px;transform:translateX(-50%);
    background:#f6d743;color:var(--navy);font-weight:800;font-size:12px;border-radius:999px;padding:0 7px;
  }
  .door .step{width:112%;height:8px;background:#d9d2c5;border-radius:3px}
  .door .plaque{
    margin-top:8px;background:#fff;border:3px solid var(--navy);border-radius:10px;
    padding:5px 8px;font-weight:800;font-size:14px;line-height:1.2;color:var(--navy);text-align:center;
    width:100%;min-height:42px;display:flex;align-items:center;justify-content:center;
  }
  .door .tag{margin-top:5px;font-size:11px;font-weight:800;color:#fff;border-radius:999px;padding:1px 9px}

  .empty{text-align:center;padding:40px 10px;font-size:20px;font-weight:700;color:var(--navy)}
  .empty .big{font-size:64px;display:block;margin-bottom:8px}

  .results-title{text-align:center;font-weight:800;color:var(--navy);margin:0 0 10px;font-size:18px}

  /* ---------- picker ---------- */
  .veil{position:fixed;inset:0;background:rgba(29,53,87,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
  .veil.open{display:flex}
  .picker{
    background:#fff;border-radius:24px;padding:20px 20px 22px;width:100%;max-width:340px;text-align:center;
    border:5px solid var(--navy);animation:pop .22s ease-out;position:relative;
  }
  @keyframes pop{from{transform:scale(.8);opacity:0}}
  .picker h3{font-size:22px;color:var(--navy);margin:2px 0 14px}
  .picker .list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .picker a{
    display:block;text-decoration:none;font-weight:800;font-size:17px;color:#fff;border-radius:14px;padding:12px 6px;
    box-shadow:0 4px 0 rgba(0,0,0,.18);
  }
  .picker a:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  .picker .x{position:absolute;top:8px;right:12px;font-size:22px;opacity:.5}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120px);
    background:var(--navy);color:#fff;font-weight:700;border-radius:999px;padding:10px 20px;transition:transform .25s;z-index:30
  }
  .toast.show{transform:translateX(-50%) translateY(0)}

  @media (max-width:720px){
    .levels{grid-template-columns:repeat(6,1fr);gap:16px 12px}
    .level{grid-column:span 2;margin-bottom:0!important}
    .level:nth-child(4){grid-column:2 / span 2}
    .level:nth-child(5){grid-column:4 / span 2}
    .level .emo{font-size:44px}
    .level .name{font-size:17px}
    .scene{height:150px}
  }
  @media (max-width:380px){
    .levels{grid-template-columns:repeat(2,1fr)}
    .level,.level:nth-child(4),.level:nth-child(5){grid-column:auto}
    .level:nth-child(5){grid-column:1 / -1;justify-self:center;width:50%}
  }

  /* ---------- exam room header ---------- */
  body{
    background-color:#f7f4ea;
    background-image:
      linear-gradient(rgba(29,53,87,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(29,53,87,.06) 1px,transparent 1px);
    background-size:26px 26px;
  }
  .exam-head{
    display:flex;align-items:center;justify-content:center;gap:22px;
    margin:18px 0 34px;position:relative;
  }
  .clock{width:96px;height:96px;flex:0 0 auto;filter:drop-shadow(0 5px 0 rgba(29,53,87,.18))}
  .clock .sec{transform-origin:60px 60px;animation:tick 60s steps(60) infinite}
  @keyframes tick{to{transform:rotate(360deg)}}
  .head-text{text-align:center}
  .head-text h1{
    font-size:clamp(30px,6vw,48px);color:var(--navy);letter-spacing:1px;
    text-shadow:3px 3px 0 #fff;
  }
  .head-text .sub{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
  .pencil{
    width:120px;height:16px;border-radius:3px;position:relative;
    background:linear-gradient(90deg,#f19aa9 0 14px,#c0c4cc 14px 22px,#f6c945 22px 100px,transparent 100px);
  }
  .pencil::after{content:"";position:absolute;right:0;top:0;border-left:20px solid #f1d9b5;border-top:8px solid transparent;border-bottom:8px solid transparent}
  .pencil::before{content:"";position:absolute;right:0;top:5px;border-left:7px solid #24324a;border-top:3px solid transparent;border-bottom:3px solid transparent;z-index:1}
  .sheet{display:flex;gap:6px}
  .sheet i{width:18px;height:18px;border-radius:50%;border:3px solid var(--navy);background:#fff}
  .sheet i.on{background:var(--navy)}
  .aplus{
    font-size:44px;font-weight:900;color:var(--red);border:5px solid var(--red);border-radius:50%;
    width:86px;height:86px;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);
    flex:0 0 auto;opacity:.9;
  }
  .aplus sup{font-size:26px}

  /* ---------- exam booklets (home) ---------- */
  .levels{grid-template-columns:repeat(5,1fr);gap:16px;align-items:end;padding-top:10px}
  .levels::after{ /* desk */
    background:#c99a64;background-image:none;border-top:6px solid #a8773f;height:24px;bottom:-30px;
    border-radius:6px;left:-8px;right:-8px;
  }
  .level{
    border-radius:6px;padding:0 0 14px;border:3px solid var(--navy);box-shadow:5px 6px 0 rgba(29,53,87,.22);
    background:#fff;overflow:visible;
  }
  .level:active{box-shadow:2px 2px 0 rgba(29,53,87,.22)}
  .level .band{
    display:block;background:var(--c);color:#fff;font-weight:900;font-size:19px;padding:9px 4px 8px;
    border-bottom:3px solid var(--navy);letter-spacing:.5px;
  }
  .level .lines{display:block;margin:10px 14px 0}
  .level .lines i{display:block;height:3px;background:#dde3ea;margin-bottom:6px;border-radius:2px}
  .level .lines i:nth-child(2){width:70%}
  .level .emo{font-size:50px;margin-top:6px}
  .level .bubbles{display:flex;justify-content:center;gap:5px;margin-top:8px}
  .level .bubbles i{width:13px;height:13px;border-radius:50%;border:2px solid var(--navy)}
  .level .bubbles i.on{background:var(--navy)}
  .level .stars{margin-top:8px}
  .level .stamp{
    position:absolute;right:-12px;top:58px;transform:rotate(12deg);
    font-size:11px;font-weight:900;color:var(--c);border:3px solid var(--c);border-radius:8px;
    padding:2px 6px;background:rgba(255,255,255,.92);white-space:nowrap;
  }
  .level .name{display:none}
  .level .count{top:-14px;right:-12px}
  .road-space{height:46px}
  @media (max-width:720px){
    .exam-head{gap:12px}
    .clock{width:70px;height:70px}
    .aplus{width:64px;height:64px;font-size:32px;border-width:4px}
    .aplus sup{font-size:18px}
    .pencil{width:84px}
    .level .emo{font-size:42px}
    .level .band{font-size:17px}
    .levels{grid-template-columns:repeat(6,1fr);gap:22px 14px}
    .level{grid-column:span 2}
    .level:nth-child(4){grid-column:2 / span 2}
    .level:nth-child(5){grid-column:4 / span 2}
    .level .stamp{font-size:10px;right:-8px}
  }
  @media (max-width:380px){
    .levels{grid-template-columns:repeat(2,1fr)}
    .level,.level:nth-child(4),.level:nth-child(5){grid-column:auto}
    .level:nth-child(5){grid-column:1 / -1;justify-self:center;width:50%}
  }
  @media (max-width:420px){ .aplus{display:none} }
  /* ---------- London + exam fusion ---------- */
  body{
    background-color:#f7f4ea;
    background-image:
      linear-gradient(180deg,var(--sky1) 0,var(--sky2) 190px,rgba(247,244,234,0) 190px),
      linear-gradient(rgba(29,53,87,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(29,53,87,.06) 1px,transparent 1px);
    background-size:100% 100%,26px 26px,26px 26px;
    background-repeat:no-repeat,repeat,repeat;
  }
  .scene{margin-top:-46px}
  .bb-sec{transform-origin:22px 92px;animation:tick 60s steps(60) infinite}
  .exam-head{margin:-14px 0 34px}
  @media (max-width:720px){
    body{background-image:
      linear-gradient(180deg,var(--sky1) 0,var(--sky2) 150px,rgba(247,244,234,0) 150px),
      linear-gradient(rgba(29,53,87,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(29,53,87,.06) 1px,transparent 1px);}
    .aplus{display:flex!important;width:56px;height:56px;font-size:26px}
  }
  @media (max-width:420px){ .exam-head{gap:8px} .head-text h1{font-size:28px} .aplus{display:none!important} }
  /* ---------- result envelopes (home) ---------- */
  .level.env{
    display:flex;flex-direction:column;align-items:center;position:relative;background:#fff;
    border:3px solid var(--navy);border-radius:8px;padding:0 4px 10px;
    box-shadow:4px 5px 0 rgba(29,53,87,.22);
  }
  .level.env:active{box-shadow:1px 2px 0 rgba(29,53,87,.22)}
  .env .top{position:relative;align-self:stretch;margin:0 -4px;height:62px}
  .env .flap{position:absolute;inset:0;background:var(--c);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:5px 5px 0 0}
  .env .seal{
    position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);
    width:42px;height:42px;border-radius:50%;background:#b3202a;border:2px solid var(--navy);
    display:flex;align-items:center;justify-content:center;font-size:22px;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.25);
  }
  .env .pstamp{
    position:absolute;top:6px;right:6px;min-width:30px;height:34px;padding:0 3px;background:#fff;
    border:2px dashed var(--navy);display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:900;color:var(--navy);white-space:nowrap;
  }
  .env .nm{display:block;margin-top:30px;text-align:center;font-weight:900;font-size:19px;color:var(--navy);line-height:1.2}
  .env .stars{display:block;text-align:center;font-size:11px;margin:4px 0 0}
  .env .count{top:-14px;right:auto;left:-12px;z-index:2}
  @media (max-width:900px){ .env .nm{font-size:16px} }
  @media (max-width:720px){
    .env .top{height:50px}
    .env .seal{width:34px;height:34px;font-size:17px;bottom:-16px}
    .env .nm{font-size:15px;margin-top:25px}
    .env .stars{font-size:9px}
    .env .pstamp{font-size:8px;height:26px;min-width:24px;top:4px;right:4px}
  }

  /* ---------- richer background ---------- */
  body{
    background-color:#fbf3e4;

  .head-text h1{font-family:'Lilita One','Trebuchet MS',sans-serif;font-weight:400;letter-spacing:1px}
  .env .nm{font-family:'Lilita One','Trebuchet MS',sans-serif;font-weight:400;letter-spacing:.5px;font-size:23px}
  @media (max-width:900px){ .env .nm{font-size:20px} }
  @media (max-width:720px){ .env .nm{font-size:18px} }
  /* highlighter + postmark */
  .head-text h1 .hl{position:relative;display:inline-block;padding:0 12px;z-index:0}
  .head-text h1 .hl::before{
    content:"";position:absolute;left:0;right:0;top:52%;height:40%;z-index:-1;
    background:rgba(255,222,50,.85);border-radius:3px 10px 4px 12px;transform:rotate(-1.5deg) skewX(-8deg);
  }
  .postmark{width:120px;flex:0 0 auto;transform:rotate(-10deg);opacity:.88}
  @media (max-width:720px){ .postmark{width:82px} }
  @media (max-width:420px){ .postmark{width:62px} .exam-head{gap:4px} .head-text h1 .hl{padding:0 6px} }
  /* ---------- envelope animations ---------- */
  .levels .env{animation:drop .6s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(var(--i) * .12s + .15s)}
  @keyframes drop{from{opacity:0;transform:translateY(-60px) rotate(-6deg)}}
  .env .top{z-index:2}
  .env .flap{transform-origin:50% 0;transition:transform .35s ease}
  .env .seal{transition:transform .3s ease,opacity .3s;animation:wobble 4s ease-in-out infinite;animation-delay:calc(var(--i) * .7s + 1s)}
  @keyframes wobble{0%,88%,100%{transform:translateX(-50%) rotate(0)}92%{transform:translateX(-50%) rotate(-14deg)}96%{transform:translateX(-50%) rotate(12deg)}}
  .env .letter{
    position:absolute;left:22%;right:22%;top:6px;height:58%;background:#fff;border:2px solid var(--navy);border-radius:4px;
    z-index:1;opacity:0;transform:translateY(0);transition:transform .4s ease .15s,opacity .2s ease .15s;padding:8px 8px 0;
  }
  .env .letter i{display:block;height:3px;background:#dde3ea;margin-bottom:5px;border-radius:2px}
  .env .letter i+i{width:70%}
  .env .letter b{display:block;text-align:center;font-size:10px;margin-top:2px}
  .env.open .flap,.env.open:hover .flap{transform:scaleY(-1);filter:brightness(.92)}
  .env.open .top{z-index:0}
  .env.open .seal,.env.open:hover .seal{animation:none;transform:translateX(-50%) scale(1.6);opacity:0}
  .env.open .letter{opacity:1;transform:translateY(-58%)}
  .env.open{z-index:5}
  .env .count{z-index:4;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @media (hover:hover){
    .env:hover .flap{transform:scaleY(.82)}
    .env:hover .seal{animation:none;transform:translateX(-50%) translateY(-8px)}
  }
  @media (prefers-reduced-motion:reduce){
    .levels .env,.env .seal,.env .count{animation:none}
  }
  /* ---------- level banner ---------- */
  .lvl-banner{
    display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
    background:#fff;border:3px solid var(--navy);border-top:14px solid var(--c);border-radius:10px;
    padding:12px 16px;margin:0 auto 26px;max-width:560px;box-shadow:4px 5px 0 rgba(29,53,87,.2);
  }
  .lb-seal{width:46px;height:46px;border-radius:50%;background:#b3202a;border:2px solid var(--navy);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
  .lb-name{font-family:'Lilita One',sans-serif;font-size:32px;color:var(--navy)}
  .lb-stars{font-size:14px}
  .lb-sep{font-size:28px;color:#9aa3ad;font-weight:900}
  .lb-paper{font-family:'Lilita One',sans-serif;font-size:24px;color:var(--c)}

  /* ---------- layer 2: three exam papers ---------- */
  .papers{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:760px;margin:0 auto}
  .paper{
    position:relative;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--navy);
    background:#fff;border:3px solid var(--navy);border-radius:8px;padding:30px 10px 16px;
    box-shadow:5px 6px 0 rgba(29,53,87,.22);transition:transform .18s;
    animation:drop .55s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(var(--i) * .12s);
  }
  .paper:hover{transform:translateY(-6px) rotate(-1deg)}
  .paper:active{transform:translateY(2px)}
  .paper .clip{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:70px;height:24px;background:var(--c);border:3px solid var(--navy);border-radius:8px 8px 4px 4px}
  .paper .p-ic{font-size:58px;line-height:1.1}
  .paper .p-name{font-family:'Lilita One',sans-serif;font-size:22px;margin-top:8px;text-align:center;line-height:1.15;min-height:2.3em;display:flex;align-items:center}
  .paper .p-lines{display:block;align-self:stretch;margin:6px 10px 0}
  .paper .p-lines i{display:block;height:3px;background:#dde3ea;margin-top:7px;border-radius:2px}
  .paper .p-lines i:nth-child(2){width:80%}.paper .p-lines i:nth-child(3){width:55%}
  .paper .count{left:-12px;right:auto;top:-14px}

  /* ---------- layer 3: quiz letters ---------- */
  .quizzes{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:760px;margin:0 auto}
  .quiz{
    position:relative;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--navy);
    background:#fff;border:3px solid var(--navy);border-radius:6px;padding:20px 8px 14px;overflow:hidden;
    box-shadow:4px 5px 0 rgba(29,53,87,.2);transition:transform .18s;
    animation:drop .5s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(var(--i) * .09s);
  }
  .quiz:hover{transform:translateY(-5px)}
  .quiz:active{transform:scale(.97)}
  .quiz .q-flag{position:absolute;top:0;left:0;right:0;height:10px;background:var(--c)}
  .quiz .q-ic{font-size:36px}
  .quiz .q-name{font-family:'Lilita One',sans-serif;font-size:24px;margin-top:4px}

  @media (max-width:720px){
    .papers{grid-template-columns:1fr;gap:20px;max-width:340px}
    .paper{flex-direction:row;padding:18px 16px;gap:14px;justify-content:flex-start}
    .paper .p-ic{font-size:44px}
    .paper .p-name{margin:0;min-height:0;text-align:left;font-size:22px}
    .paper .p-lines{display:none}
    .paper .clip{left:auto;right:18px;transform:none;width:50px;height:20px}
    .quizzes{grid-template-columns:repeat(2,1fr);gap:16px;max-width:360px}
    .lb-name{font-size:26px}.lb-paper{font-size:20px}
  }
  .paper .count{
    position:absolute;top:-14px;left:-12px;min-width:30px;height:30px;border-radius:50%;z-index:3;
    background:var(--red);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;
    border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.2);padding:0 4px;animation:bob 2.4s ease-in-out infinite;
  }
  .paper .count:empty{display:none}
  .papers{margin-top:6px}
  .ico{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;overflow:visible}
  .paper .p-ic{font-size:64px}
  .quiz .q-ic{font-size:44px;line-height:1}
  .lb-paper{display:inline-flex;align-items:center;gap:6px}
  @media (max-width:720px){ .paper .p-ic{font-size:50px;line-height:1} }
  /* ---------- London bus Back button ---------- */
  .backbtn{
    display:inline-flex;align-items:center;gap:8px;position:relative;
    background:var(--red);color:#fff;border:3px solid var(--navy);border-radius:14px;
    padding:6px 16px 6px 10px;box-shadow:0 4px 0 var(--navy);
    font-family:'Lilita One',sans-serif;font-size:20px;letter-spacing:.5px;line-height:1;
    transition:transform .12s, box-shadow .12s;
  }
  .backbtn::before{ /* destination-sign strip */
    content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.35)
  }
  .backbtn .bk-bus{width:38px;height:26px;overflow:visible}
  .backbtn .bk-txt{background:#1d3557;color:#f6d743;border-radius:6px;padding:4px 8px 3px}
  .backbtn .bk-w{transform-box:fill-box;transform-origin:center}
  .backbtn:hover .bk-bus{animation:busgo .6s ease-in-out infinite alternate}
  .backbtn:hover .bk-w{animation:spin .5s linear infinite reverse}
  @keyframes busgo{from{transform:translateX(0)}to{transform:translateX(-4px)}}
  .backbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
  .backbtn.go .bk-bus{animation:busaway .35s ease-in forwards}
  @keyframes busaway{to{transform:translateX(-26px);opacity:0}}
  @media (max-width:420px){ .backbtn{font-size:17px;padding:5px 12px 5px 8px} .backbtn .bk-bus{width:32px;height:22px} }
  .backbtn{font-size:15px;padding:4px 10px 4px 7px;gap:5px;border-width:2.5px;border-radius:11px;box-shadow:0 3px 0 var(--navy)}
  .backbtn .bk-bus{width:28px;height:19px}
  .backbtn .bk-txt{padding:3px 6px 2px;border-radius:5px}

<div class="toast" id="toast">🚧 Coming soon!</div>

<script>
/* =========================================================
   LEVELS — five envelopes on the Cambridge home page
   ========================================================= */
const LEVELS = [
  { id:"starters", name:"Starters", emo:"🐣", stars:1, cefr:"Pre A1",         color:"var(--starters)" },
  { id:"movers",   name:"Movers",   emo:"🐥", stars:2, cefr:"A1",             color:"var(--movers)" },
  { id:"flyers",   name:"Flyers",   emo:"🕊️", stars:3, cefr:"A2",             color:"var(--flyers)" },
  { id:"ket",      name:"KET",      emo:"🔑", stars:4, cefr:"A2 Key",         color:"var(--ket)" },
  { id:"pet",      name:"PET",      emo:"🏆", stars:5, cefr:"B1 Preliminary", color:"var(--pet)" }
];

/* Three papers inside every level */
const PAPERS = [
  { id:"listening", name:"Listening",         ic:`<svg class="ico" viewBox="0 0 64 64"><path d="M10 38V32a22 22 0 0 1 44 0v6" fill="none" stroke="#1d3557" stroke-width="5" stroke-linecap="round"/><rect x="6" y="34" width="14" height="22" rx="6" fill="#d62828" stroke="#1d3557" stroke-width="3.5"/><rect x="44" y="34" width="14" height="22" rx="6" fill="#d62828" stroke="#1d3557" stroke-width="3.5"/><path d="M26 40q4 5 0 10M32 37q7 8 0 16" fill="none" stroke="#f2a417" stroke-width="3.5" stroke-linecap="round"/></svg>` },
  { id:"rw",        name:"Reading & Writing", ic:`<svg class="ico" viewBox="0 0 64 64"><path d="M6 16q12-6 25 2v36q-13-8-25-2z" fill="#fff" stroke="#1d3557" stroke-width="3.5" stroke-linejoin="round"/><path d="M58 16q-12-6-25 2v36q13-8 25-2z" fill="#cfeaff" stroke="#1d3557" stroke-width="3.5" stroke-linejoin="round"/><path d="M12 25q7-3 13 1M12 33q7-3 13 1M12 41q7-3 13 1" stroke="#9fb3c8" stroke-width="2.5" fill="none" stroke-linecap="round"/><g transform="rotate(-40 46 34)"><rect x="40" y="6" width="11" height="34" rx="2" fill="#f6c945" stroke="#1d3557" stroke-width="3"/><rect x="40" y="6" width="11" height="7" fill="#f19aa9" stroke="#1d3557" stroke-width="3"/><path d="M40 40l5.5 10 5.5-10z" fill="#f1d9b5" stroke="#1d3557" stroke-width="3" stroke-linejoin="round"/></g></svg>` },
  { id:"speaking",  name:"Speaking",          ic:`<svg class="ico" viewBox="0 0 64 64"><path d="M6 12h32a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6H20l-9 8v-8H6a6 6 0 0 1-6-6V18a6 6 0 0 1 6-6z" transform="translate(3 0)" fill="#d62828" stroke="#1d3557" stroke-width="3.5" stroke-linejoin="round"/><circle cx="17" cy="25" r="2.6" fill="#fff"/><circle cx="25" cy="25" r="2.6" fill="#fff"/><circle cx="33" cy="25" r="2.6" fill="#fff"/><path d="M30 30h24a6 6 0 0 1 6 6v10a6 6 0 0 1-6 6h-3v7l-8-7H30a6 6 0 0 1-6-6V36a6 6 0 0 1 6-6z" fill="#2f9be0" stroke="#1d3557" stroke-width="3.5" stroke-linejoin="round"/><path d="M33 41q4 4 9 0q5-4 9 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>` }
];

/* =========================================================
   QUIZZES — add new worksheet files here, in order.
   The 1st file becomes Quiz 1, the 2nd Quiz 2, ...
   File names: cambridge_<level>_<paper>_<n>.html
   "demo:" = sample only (shows "Coming soon"); delete when real files exist
   ========================================================= */
const QUIZZES = {
  starters: {
    listening: ["demo:cambridge_starters_listening_1.html","demo:cambridge_starters_listening_2.html","demo:cambridge_starters_listening_3.html"],
    rw:        ["demo:cambridge_starters_rw_1.html"],
    speaking:  []
  },
  movers:   { listening: [], rw: ["demo:cambridge_movers_rw_1.html"], speaking: [] },
  flyers:   { listening: [], rw: [], speaking: [] },
  ket:      { listening: [], rw: ["demo:cambridge_ket_rw_1.html","demo:cambridge_ket_rw_2.html"], speaking: [] },
  pet:      { listening: [], rw: [], speaking: [] }
};

/* ---------- helpers ---------- */
const lv = id => LEVELS.find(l=>l.id===id);
const pp = id => PAPERS.find(p=>p.id===id);
const list = (l,p) => ((QUIZZES[l]||{})[p]) || [];
const total = l => PAPERS.reduce((n,p)=>n+list(l,p.id).length,0);
const view = document.getElementById("view");
const homeBtn = document.getElementById("homeBtn");
const toast = document.getElementById("toast");
function showToast(){ toast.classList.add("show"); clearTimeout(showToast.t); showToast.t=setTimeout(()=>toast.classList.remove("show"),1600); }

/* ---------- layer 1: home (five envelopes) ---------- */
function renderHome(){
  homeBtn.style.display="none";
  view.innerHTML = `<div class="levels">${LEVELS.map((L,i)=>{
      const c = total(L.id);
      return `<a class="level env" href="#${L.id}" style="--c:${L.color};--i:${i};text-decoration:none;color:inherit">
        <span class="letter"><i></i><i></i><b>${"⭐".repeat(L.stars)}</b></span>
        <span class="count">${c||""}</span>
        <span class="top"><span class="flap"></span>
          <span class="pstamp">${L.cefr.replace(" Preliminary","").replace(" Key","")}</span>
          <span class="seal">${L.emo}</span></span>
        <span class="nm">${L.name}</span>
        <span class="stars">${"⭐".repeat(L.stars)}</span>
      </a>`}).join("")}</div><div class="road-space"></div>`;
}

function levelBanner(L, P){
  return `<div class="lvl-banner" style="--c:${L.color}">
    <span class="lb-seal">${L.emo}</span>
    <span class="lb-name">${L.name}</span>
    ${P?`<span class="lb-sep">›</span><span class="lb-paper">${P.ic} ${P.name}</span>`:`<span class="lb-stars">${"⭐".repeat(L.stars)}</span>`}
  </div>`;
}

/* ---------- layer 2: three papers ---------- */
function renderLevel(L){
  view.innerHTML = levelBanner(L) + `<div class="papers">${PAPERS.map((P,i)=>{
      const n = list(L.id,P.id).length;
      return `<a class="paper" href="#${L.id}/${P.id}" style="--c:${L.color};--i:${i}">
        <span class="count">${n||""}</span>
        <span class="clip"></span>
        <span class="p-ic">${P.ic}</span>
        <span class="p-name">${P.name}</span>
        <span class="p-lines"><i></i><i></i><i></i></span>
      </a>`}).join("")}</div>`;
}

/* ---------- layer 3: Quiz 1, 2, 3 ---------- */
function renderPaper(L,P){
  const files = list(L.id,P.id);
  view.innerHTML = levelBanner(L,P) + (files.length
    ? `<div class="quizzes">${files.map((f,k)=>{
        const demo = f.startsWith("demo:");
        return `<a class="quiz" href="${demo?"#":f}" ${demo?'data-demo="1"':""} style="--c:${L.color};--i:${k}">
          <span class="q-flag"></span>
          <span class="q-ic">${P.ic}</span>
          <span class="q-name">Quiz ${k+1}</span>
        </a>`}).join("")}</div>`
    : `<div class="empty"><span class="big">🚌💨</span>Coming soon!</div>`);
}

/* ---------- router ---------- */
function route(){
  const [l,p] = location.hash.replace("#","").split("/");
  const L = lv(l), P = pp(p);
  if(!L){ renderHome(); return; }
  homeBtn.style.display="";
  homeBtn.dataset.up = P ? "#"+L.id : "";
  P ? renderPaper(L,P) : renderLevel(L);
  window.scrollTo({top:0});
}

homeBtn.addEventListener("click", ()=>{
  homeBtn.classList.add("go");
  setTimeout(()=>{ homeBtn.classList.remove("go"); location.hash = homeBtn.dataset.up || ""; }, 300);
});
window.addEventListener("hashchange", route);

/* envelope opening on home, demo quizzes */
view.addEventListener("click", e=>{
  const q = e.target.closest(".quiz[data-demo]");
  if(q){ e.preventDefault(); showToast(); return; }
  const env = e.target.closest(".env"); if(!env) return;
  e.preventDefault();
  if(env.classList.contains("open")) return;
  env.classList.add("open");
  setTimeout(()=>{ location.hash = env.getAttribute("href"); }, 750);
});

route();
</script>
</body>
