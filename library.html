<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wagor - Jamie's Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@800&display=swap">
<style>
  :root { --ink: #1B2A57; --sun: #FFE14D; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: #5CCBFF; color: var(--ink); font-family: "Lilita One", "Baloo 2", "Arial Rounded MT Bold", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 4px solid #fff; outline-offset: 3px; box-shadow: 0 0 0 7px var(--ink); }

  /* ---------- back to the Jamie's Library cover ---------- */
  .tohome { position: absolute; left: 16px; top: 14px; z-index: 5; display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px 4px 10px; font-size: 20px; line-height: 1; background: var(--sun); border: 4px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
  .tohome:hover { transform: translateY(-2px); }
  .tohome:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  @media (max-width: 480px) { .tohome { padding: 7px 9px; border-radius: 50%; } .tohome span { display: none; } }

  /* ---------- Home ---------- */
  #home { position: relative; min-height: 100vh; overflow: hidden; display: flex; flex-direction: column; background: #5CCBFF; }
  #stagewrap { position: relative; flex: none; width: 100%; }
  .ground { flex: 1; background: #F7A93E; }
  #stage { position: absolute; left: 50%; top: 0; width: 480px; height: 760px; transform-origin: top center; }
  #stage h1 { position: absolute; left: 50%; top: 34px; margin: 0; padding: 10px 28px 4px; white-space: nowrap; font-weight: 400; font-size: 46px; line-height: 1.05; background: var(--sun); border: 4px solid var(--ink); border-radius: 18px; box-shadow: 0 7px 0 var(--ink); transform: translateX(-50%) rotate(-2deg); }
  .node { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .node i { display: flex; align-items: center; justify-content: center; width: 190px; height: 190px; border-radius: 50%; border: 6px solid var(--ink); box-shadow: 0 10px 0 var(--ink); transition: transform .15s; }
  .node b { padding: 6px 26px 2px; font-weight: 400; font-size: 34px; line-height: 1.1; background: #fff; border: 4px solid var(--ink); border-radius: 14px; box-shadow: 0 5px 0 var(--ink); }
  .node:hover i { transform: translateY(-4px); }

  /* ---------- signpost entrances ---------- */
  .signb { position: absolute; display: block; width: 260px; height: 82px; filter: drop-shadow(0 7px 0 rgba(27,42,87,.9)); transition: transform .15s; }
  .signb svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .signb.g { transform-origin: 96% 50%; animation: swayg 4s ease-in-out infinite; }
  .signb.r { transform-origin: 4% 50%; animation: swayr 4s ease-in-out infinite; animation-delay: -2s; }
  @keyframes swayg { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
  @keyframes swayr { 0%,100% { transform: rotate(1.5deg); } 50% { transform: rotate(-1.5deg); } }
  .signb:hover { animation-play-state: paused; }
  .signb.g:hover { transform: translateX(-8px) rotate(-3deg); }
  .signb.r:hover { transform: translateX(8px) rotate(3deg); }
  .signb:active { filter: drop-shadow(0 2px 0 rgba(27,42,87,.9)); }
  .signb.g:active { transform: translate(-8px,5px); }
  .signb.r:active { transform: translate(8px,5px); }

  #stage h1 { display: inline-flex; align-items: center; gap: 6px; }
  #stage h1 .globe { width: 60px; height: 60px; margin: -10px -10px -8px 0; flex: none; overflow: visible; }
  #stage h1 .globe .orbit { transform-box: view-box; transform-origin: 0 0; animation: orbit 8s linear infinite; }
  @keyframes orbit { to { transform: rotate(360deg); } }

  /* ---------- Shelf pages ---------- */
  #shelf { position: relative; min-height: 100vh; overflow: hidden; background-color: #FFD27A; background-image: radial-gradient(rgba(201,138,60,.28) 2px, transparent 2.5px), radial-gradient(rgba(201,138,60,.2) 1.5px, transparent 2px); background-size: 46px 46px, 70px 70px; background-position: 0 0, 23px 31px; }
  .roll2 { transform-box: fill-box; transform-origin: center; animation: spin 5s linear infinite; }
  .sunrays { transform-box: fill-box; transform-origin: center; animation: spin 30s linear infinite; }
  #shelf .decor { position: fixed; left: 0; bottom: 0; width: 100%; height: 150px; pointer-events: none; }
  #shelf .dunes { position: fixed; left: 0; bottom: 0; width: 100%; height: 150px; pointer-events: none; }
  #shelf::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 240px; background: #5CCBFF; }
  #shelf .top { position: absolute; left: 50%; top: 0; width: 480px; height: 240px; overflow: visible; transform: translateX(-50%); }
  .wrap { position: relative; max-width: 980px; margin: 0 auto; padding: 30px 0 60px; }
  .bar { position: relative; display: flex; align-items: center; justify-content: center; min-height: 64px; }
  .back { position: absolute; left: 20px; top: 0; display: flex; align-items: center; justify-content: center; width: 54px; height: 54px; border-radius: 50%; background: var(--sun); border: 4px solid var(--ink); box-shadow: 0 5px 0 var(--ink); }
  #title { margin: 0 0 0 40px; padding: 8px 34px 2px; font-weight: 400; font-size: 42px; line-height: 1.1; border: 4px solid var(--ink); border-radius: 16px; box-shadow: 0 6px 0 var(--ink); transform: rotate(-2deg); }
  .srch { display: flex; align-items: center; gap: 12px; max-width: 520px; height: 54px; margin: 26px 20px 0; padding: 0 20px; background: #fff; border: 4px solid var(--ink); border-radius: 18px; }
  @media (min-width: 600px) { .srch { margin-left: auto; margin-right: auto; } }
  .srch input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 800 17px "Nunito", sans-serif; color: var(--ink); }
  .srch input:focus-visible { outline: 0; box-shadow: none; }
  .tag { position: relative; display: inline-block; margin: 52px 0 0 42px; padding: 5px 20px 1px; font-size: 24px; line-height: 1.2; background: #FFF4D0; border: 4px solid var(--ink); border-radius: 6px; box-shadow: 0 4px 0 var(--ink); }
  .tag::before, .tag::after { content: ""; position: absolute; top: -7px; bottom: -7px; width: 12px; background: #C98A3C; border: 4px solid var(--ink); border-radius: 8px; }
  .tag::before { left: -16px; }
  .tag::after { right: -16px; }
  .shelf { display: flex; gap: 14px; margin-top: 10px; padding: 26px 20px 4px 26px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; }
  .shelf::-webkit-scrollbar { display: none; }
  @media (min-width: 820px) { .shelf { flex-wrap: wrap; row-gap: 12px; overflow: visible; } }
  .cell { position: relative; flex: none; margin-bottom: 18px; scroll-snap-align: start; }
  .cell::after { content: ""; position: absolute; left: -7px; right: -7px; bottom: -18px; height: 18px; background-color: #E2A65A; background-image: linear-gradient(90deg, rgba(27,42,87,.28) 3px, transparent 3px); background-size: 44px 100%; border-bottom: 4px solid var(--ink); }
  .bk { display: flex; align-items: center; justify-content: center; width: min(190px, calc((100vw - 70px) / 2)); aspect-ratio: 1; padding: 12px; font: inherit; color: var(--ink); cursor: pointer; border: 4px solid var(--ink); border-radius: 10px 16px 16px 10px; box-shadow: inset -10px 0 0 rgba(0,0,0,.16); transition: transform .15s; }
  @media (min-width: 820px) { .bk { width: 190px; } }
  .bk:hover { transform: translateY(-5px); }
  .bk { position: relative; }
  .bk::before { content: ""; position: absolute; top: 15px; left: 50%; width: 28px; height: 20px; margin-left: -14px; background: #FFE14D; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .bk span { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 22px 8px 8px; overflow: hidden; text-align: center; font-size: 25px; line-height: 1.1; overflow-wrap: anywhere; border: 3px solid rgba(255,225,120,.95); border-radius: 6px; }
  /* treasure-chest books */
  .cell .bk { aspect-ratio: 190 / 172; padding: 0; background: none; border: 0; border-radius: 0; box-shadow: none; display: block; overflow: visible; }
  .cell .bk::before { content: none; }
  .bk svg.chest { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .bk .lid { transition: transform .18s; transform-box: fill-box; transform-origin: 50% 100%; }
  .bk:hover .lid { transform: translateY(-9px) rotate(-4deg); }
  .bk .tw1, .bk .tw2 { transform-box: fill-box; transform-origin: center; animation: twk 1.8s ease-in-out infinite; }
  .bk .tw2 { animation-delay: .9s; }
  @keyframes twk { 0%,100% { transform: scale(.4) rotate(0); } 50% { transform: scale(1.15) rotate(25deg); } }
  .cell .bk span { position: absolute; left: 15%; right: 15%; top: 56%; bottom: 5%; width: auto; height: auto; padding: 1px 3px; font-size: 17px; line-height: 1; background: #FFF4D0; border: 3px solid var(--ink); border-radius: 8px; }
  .none { margin: 50px 26px 0; font: 800 20px "Nunito", sans-serif; text-align: center; }

  /* ---------- Quiz picker ---------- */
  #modal { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(27,42,87,.6); }
  .pop { position: relative; width: 100%; max-width: 420px; padding: 34px 24px 30px; text-align: center; background: #FFF4D0; border: 4px solid var(--ink); border-radius: 30px; box-shadow: 0 10px 0 var(--ink); }
  .pop h2 { margin: 0; font-weight: 400; font-size: 34px; line-height: 1.1; }
  .pop p { margin: 8px 0 22px; font: 800 17px "Nunito", sans-serif; color: #3B4673; }
  .x { position: absolute; right: 12px; top: 12px; display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; padding: 0; cursor: pointer; border-radius: 50%; background: #fff; border: 3px solid var(--ink); }
  .qb { display: flex; flex-wrap: wrap; gap: 14px; }
  .qb a { flex: 1 1 120px; display: flex; align-items: center; justify-content: center; min-height: 66px; padding-top: 4px; font-size: 28px; background: #35D0BA; border: 4px solid var(--ink); border-radius: 20px; box-shadow: 0 7px 0 var(--ink); }
  .qb a:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--ink); }
  /* ---------- Game motion ---------- */
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes wig { 0%,100% { transform: translateX(-50%) rotate(-2deg); } 50% { transform: translateX(-50%) rotate(2deg) scale(1.03); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes drift { 0%,100% { transform: translateX(-18px); } 50% { transform: translateX(18px); } }
  @keyframes march { to { stroke-dashoffset: -22; } }
  @keyframes twinkle { 0%,100% { transform: scale(.4); opacity: .5; } 50% { transform: scale(1.1); opacity: 1; } }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  @keyframes pop { from { transform: scale(.5) translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes drop { from { transform: translateY(-30px) rotate(-2deg); opacity: 0; } to { transform: rotate(-2deg); opacity: 1; } }
  @keyframes wob { 25% { transform: translateY(-5px) rotate(-3deg); } 75% { transform: translateY(-5px) rotate(3deg); } }
  #stage h1 { animation: wig 4s ease-in-out infinite; }
  .node { animation: float 3s ease-in-out infinite; }
  .node:active i { transform: translateY(7px); box-shadow: 0 3px 0 var(--ink); }
  .march { animation: march 1.1s linear infinite; }
  .bob { animation: bob 3.2s ease-in-out infinite; }
  .bob2 { animation: bob 2.4s ease-in-out infinite; }
  .drift { animation: drift 9s ease-in-out infinite; }
  .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 1.8s ease-in-out infinite; }
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
  .fresh .cell { animation: pop .5s cubic-bezier(.34,1.56,.64,1) both; }
  #title { animation: drop .5s cubic-bezier(.34,1.56,.64,1) both; }
  .bk:hover { animation: wob .4s; }
  .pop { animation: pop .35s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes flit { 0%,100% { transform: translate(0,0); } 25% { transform: translate(14px,-10px); } 50% { transform: translate(28px,2px); } 75% { transform: translate(12px,12px); } }
  @keyframes flapk { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(.35); } }
  .fl { animation: flit 6s ease-in-out infinite; }
  .flap { transform-box: fill-box; transform-origin: center; animation: flapk .35s ease-in-out infinite; }
  @keyframes rollx { from { transform: translateX(0); } to { transform: translateX(400px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .roll { animation: rollx 9s linear infinite; }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 1.6s linear infinite; }
  @keyframes flyx { 0% { transform: translate(-90px, 6px); opacity: 0; } 10% { opacity: 1; } 50% { transform: translate(10px, -8px); } 90% { opacity: 1; } 100% { transform: translate(110px, 4px); opacity: 0; } }
  @keyframes flapb { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(-.9); } }
  @keyframes lookf { 0%, 10%, 80%, 100% { transform: translateX(0); } 20%, 35% { transform: translateX(-3px); } 50%, 65% { transform: translateX(3px); } }
  @keyframes lookp { 0%, 10%, 80%, 100% { transform: translateX(0); } 20%, 35% { transform: translateX(-2.5px); } 50%, 65% { transform: translateX(2.5px); } }
  .fly { animation: flyx 14s linear infinite; }
  .wing { transform-box: fill-box; transform-origin: center bottom; animation: flapb .55s ease-in-out infinite; }
  .look { animation: lookf 6s ease-in-out infinite; }
  .pup { animation: lookp 6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

  },
  {
    name: "A Team of Fish",
    type: "reading", grade: 1,
    quizzes: {
      1: "wonders_g1_a_team_of_fish_1.html"
    }
  },
  {
    name: "Journey to Freedom",
    type: "reading", grade: 6,
    quizzes: {
      1: "wonders_g6_journey_to_freedom_1.html"
    }
  }
];

/* Grammar 主題書架的顯示順序（沒有卷子的主題不會顯示） */
const GRAMMAR_GROUPS = [
  "Tenses", "Nouns & Articles", "Pronouns", "Prepositions",
  "Modals", "Phrasal Verbs", "Sentences & Questions", "Other"
];

/* 書的封面顏色：依書名固定，看起來隨機，但同一本書永遠同一個顏色 */
const PALETTE = ["#35D0BA", "#F4845F", "#8EA2FF", "#FF7BA9", "#6BCB77", "#B794F6", "#FFB84D", "#4DB6E8"];

/* ---------- 以下不用改 ---------- */
const $ = function (id) { return document.getElementById(id); };
let current = "reading";
let lastFocus = null;

function colorOf(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

function hay(w) {
  return [w.name, w.group || "", w.grade ? "grade " + w.grade : ""].concat(w.tags || []).join(" ").toLowerCase();
}

const CHEST = '<svg class="chest" viewBox="0 0 190 172" aria-hidden="true">'
  + '<defs><pattern id="gr" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".9" fill="#000" opacity=".12"/><circle cx="4.5" cy="4.5" r=".9" fill="#fff" opacity=".16"/></pattern></defs>'
  + '<g class="tw1"><path d="M22 10l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#FFE14D" stroke="#1B2A57" stroke-width="2.5" stroke-linejoin="round"/></g>'
  + '<g class="tw2"><path d="M170 6l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#fff" stroke="#1B2A57" stroke-width="2.5" stroke-linejoin="round"/></g>'
  + '<rect x="12" y="78" width="166" height="86" rx="10" style="fill:var(--c)" stroke="#1B2A57" stroke-width="5" stroke-linejoin="round"/>'
  + '<rect x="12" y="78" width="166" height="86" rx="10" fill="#000" opacity=".1" clip-path="inset(0 0 0 56%)"/>'
  + '<g class="lid"><path d="M30 34q0-24 20-26h90q20 2 20 26l-8 36H38z" style="fill:var(--c)" stroke="#1B2A57" stroke-width="5" stroke-linejoin="round" transform="translate(0 -10)"/></g>'
  + '<path d="M22 82q8-20 30-22t30 6q20-22 46-8t26 24z" fill="#FFE14D" stroke="#1B2A57" stroke-width="4" stroke-linejoin="round"/>'
  + '<circle cx="62" cy="66" r="9" fill="#FFF4D0" stroke="#1B2A57" stroke-width="3" stroke-linejoin="round"/><circle cx="108" cy="58" r="9" fill="#FFF4D0" stroke="#1B2A57" stroke-width="3" stroke-linejoin="round"/><path d="M136 70l7-12 7 12-7 8z" fill="#FF7BA9" stroke="#1B2A57" stroke-width="3" stroke-linejoin="round"/><path d="M36 74l5-9 5 9-5 6z" fill="#6BCB77" stroke="#1B2A57" stroke-width="3" stroke-linejoin="round"/>'
  + '<rect x="12" y="78" width="166" height="14" fill="#FFE14D" stroke="#1B2A57" stroke-width="3.5" stroke-linejoin="round"/>'
  + '</svg>';

function makeBook(w) {
  const nums = Object.keys(w.quizzes || {}).map(Number).sort(function (a, b) { return a - b; });
  const cell = document.createElement("div");
  cell.className = "cell";
  let el;
  if (nums.length === 1) {
    el = document.createElement("a");
    el.href = w.quizzes[nums[0]];
  } else {
    el = document.createElement("button");
    el.type = "button";
    el.addEventListener("click", function () { openModal(w, nums); });
  }
  el.className = "bk";
  el.style.setProperty("--c", colorOf(w.name));
  el.innerHTML = CHEST;
  const s = document.createElement("span");
  s.textContent = w.name;
  el.appendChild(s);
  cell.appendChild(el);
  return cell;
}

function renderShelf() {
  const words = $("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const hits = WORKSHEETS.filter(function (w) {
    return w.type === current && words.every(function (x) { return hay(w).indexOf(x) !== -1; });
  });
  let groups;
  if (current === "reading") {
    groups = [1, 2, 3, 4, 5, 6].map(function (g) {
      return { label: "Grade " + g, items: hits.filter(function (w) { return w.grade === g; }) };
    });
  } else {
    const names = GRAMMAR_GROUPS.slice();
    hits.forEach(function (w) { const g = w.group || "Other"; if (names.indexOf(g) === -1) names.push(g); });
    groups = names.map(function (n) {
      return { label: n, items: hits.filter(function (w) { return (w.group || "Other") === n; }) };
    });
  }
  const list = $("list");
  list.innerHTML = "";
  groups.filter(function (g) { return g.items.length; }).forEach(function (g) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = g.label;
    list.appendChild(tag);
    const shelf = document.createElement("div");
    shelf.className = "shelf";
    g.items.sort(function (a, b) { return a.name.localeCompare(b.name, "en", { sensitivity: "base" }); })
      .forEach(function (w, i) { const c = makeBook(w); c.style.animationDelay = (i * 70) + "ms"; shelf.appendChild(c); });
    list.appendChild(shelf);
  });
  if (!hits.length) {
    const p = document.createElement("p");
    p.className = "none";
    p.textContent = words.length ? "Nothing found. Try a shorter word." : "No quizzes here yet.";
    list.appendChild(p);
  }
}

function openModal(w, nums) {
  lastFocus = document.activeElement;
  $("mTitle").textContent = w.name;
  const box = $("mQuizzes");
  box.innerHTML = "";
  nums.forEach(function (n) {
    const a = document.createElement("a");
    a.href = w.quizzes[n];
    a.textContent = "Quiz " + n;
    box.appendChild(a);
  });
  $("modal").hidden = false;
  box.firstChild.focus();
}

function closeModal() {
  if ($("modal").hidden) return;
  $("modal").hidden = true;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

function route() {
  const r = location.hash.replace("#", "");
  closeModal();
  if (r === "reading" || r === "grammar") {
    current = r;
    $("home").hidden = true;
    $("shelf").hidden = false;
    $("title").textContent = r === "reading" ? "Reading" : "Grammar";
    $("title").style.background = r === "reading" ? "#8EA2FF" : "#35D0BA";
    $("q").placeholder = r === "reading" ? "Search a story" : "Search a topic";
    $("q").value = "";
    $("list").className = "fresh";
    document.title = (r === "reading" ? "Reading" : "Grammar") + " - Wagor";
    renderShelf();
  } else {
    $("shelf").hidden = true;
    $("home").hidden = false;
    document.title = "Wagor - Jamie's Library";
    fit();
  }
  window.scrollTo(0, 0);
}

/* 首頁的場景依螢幕大小縮放 */
function fit() {
  const s = Math.max(0.72, Math.min(window.innerWidth / 480, window.innerHeight / 780, 1.6));
  $("stage").style.transform = "translateX(-50%) scale(" + s + ")";
  $("stagewrap").style.height = Math.round(760 * s) + "px";
  document.documentElement.style.setProperty("--s", s);
}

$("q").addEventListener("input", function () { $("list").className = ""; renderShelf(); });
$("mClose").addEventListener("click", closeModal);
$("modal").addEventListener("click", function (e) { if (e.target === $("modal")) closeModal(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });
window.addEventListener("hashchange", route);
window.addEventListener("resize", fit);
route();
</script>
</body>
