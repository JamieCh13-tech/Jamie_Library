body[data-theme="twilight"]{--sky1:#7f86c9;--sky2:#f6c6d6;--h1:#a9cfa0;--h2:#8fbf91;--h3:#76a888;--path:#efe3cf;--tree:#7fb59a}
body[data-theme="softnight"]{--sky1:#5b7fb8;--sky2:#bcd6ef;--h1:#9fc7a3;--h2:#84b28f;--h3:#6d9d82;--path:#e9e0cf;--tree:#79ad8c}
body[data-theme="dawn"]{--sky1:#ffcfdc;--sky2:#fff3d9;--h1:#c4e5a6;--h2:#a9d98f;--h3:#8ec87d;--path:#f5e8d3;--tree:#9fd28a}
body[data-theme="mint"]{--sky1:#bfeaff;--sky2:#effff5;--h1:#bfe8c9;--h2:#a2dcb2;--h3:#86cc9c;--path:#f2ead8;--tree:#8fd3a6}
body[data-theme="latte"]{--sky1:#ffe2b8;--sky2:#fff8ec;--h1:#d6dfa6;--h2:#c2cf8e;--h3:#a9b878;--path:#f3e6cf;--tree:#b4c682}
body{--signbg:#5e4b9c;--signfg:#ffe7a3;--signsh:#3b2e6b;--star:#ffc4d6;--roof:#b0563b}
body[data-sign="rose"]{--signbg:#c96a8f;--signfg:#fff6e0;--signsh:#8f4262;--star:#fff6e0;--roof:#a8536b}
body[data-sign="indigo"]{--signbg:#3f4a8a;--signfg:#ffe7a3;--signsh:#262d5e;--star:#ffe7a3;--roof:#5e3a56}
body[data-sign="violet"]{--roof:#9c5a6e}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{min-height:100vh;font-family:"Trebuchet MS",system-ui,sans-serif;color:#1d3557;overflow-x:hidden;position:relative;
  background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 60%,var(--h1) 60%);transition:background .5s}
a{text-decoration:none;color:inherit}

/* ---------- sky ---------- */
.sky{position:absolute;inset:0;height:100%;pointer-events:none;overflow:hidden;z-index:0}
.sun{position:absolute;right:6%;top:26px;width:74px;height:74px;border-radius:50%;background:#ffd34d;box-shadow:0 0 0 12px rgba(255,211,77,.28),0 0 0 26px rgba(255,211,77,.12)}
.sun::before{content:"";position:absolute;left:21px;top:28px;width:6px;height:6px;border-radius:50%;background:#7a5200;box-shadow:26px 0 0 #7a5200}
.sun::after{content:"";position:absolute;left:22px;top:40px;width:30px;height:13px;border:4px solid #7a5200;border-top:none;border-radius:0 0 20px 20px}
body.moon .sun{background:#fff6cf;box-shadow:0 0 0 12px rgba(255,246,207,.15),0 0 40px 20px rgba(255,246,207,.2)}
body.moon .sun::before,body.moon .sun::after{display:none}
.moonbite{display:none}
body.moon .moonbite{display:block;position:absolute;right:calc(6% - 14px);top:16px;width:70px;height:70px;border-radius:50%;background:var(--sky1)}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.95;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:55%;height:160%;left:15%;top:-70%}.cloud::after{width:40%;height:130%;right:12%;top:-45%}
body.moon .cloud{opacity:.55}
@keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(110vw)}}
.fx{position:absolute;pointer-events:none}
.fx.star{width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:twinkle 2s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.2;transform:scale(.6)}to{opacity:1;transform:scale(1.2)}}
.fx.fall{top:-30px;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(80px,110vh) rotate(540deg)}}
.fx.bfly{font-size:22px;animation:flutter 7s ease-in-out infinite alternate}
@keyframes flutter{0%{transform:translate(0,0)}25%{transform:translate(40px,-30px)}50%{transform:translate(90px,10px)}75%{transform:translate(50px,40px)}100%{transform:translate(120px,-10px)}}
.bird{position:absolute;width:22px;height:10px;border:3px solid #1d3557;border-color:#1d3557 transparent transparent transparent;border-radius:50% 50% 0 0;animation:flap 1.1s ease-in-out infinite alternate}
@keyframes flap{to{transform:translateY(-6px) scaleY(.7)}}
body.moon .bird{display:none}

/* ---------- land ---------- */
.land{position:absolute;left:0;right:0;bottom:0;height:46%;z-index:1;pointer-events:none}
.land svg{width:100%;height:100%;display:block}
.h1{fill:var(--h1)}.h2{fill:var(--h2)}.h3{fill:var(--h3)}

/* ---------- building ---------- */
.wrap{position:relative;z-index:2;max-width:860px;margin:0 auto;padding:96px 14px 30px}
.scene{position:relative}
.tree{position:absolute;bottom:20px;width:110px;z-index:0}
.tree.l{left:-88px}.tree.r{right:-88px}
.tree .crown{fill:var(--tree)}
.lamp{position:absolute;bottom:20px;width:26px;z-index:3}
.lamp.l{left:-14px}.lamp.r{right:-14px}
body.moon .lamp .bulb{fill:#fff3a0;filter:drop-shadow(0 0 10px #ffe680)}
.bld{position:relative;z-index:2}
.roof{position:relative;height:110px;margin:0 -28px -4px}
.roof svg{width:100%;height:100%;display:block}
.roof .rf{fill:var(--roof)}
.facade{position:relative;background:#f3e6cc;border:4px solid #1d3557;border-bottom:none;padding:16px 22px 0;

<script>
/* doors stay closed; tapping a door opens it, then goes in */
document.querySelectorAll('.door').forEach(d=>d.addEventListener('click',e=>{
  e.preventDefault(); if(d.classList.contains('go')) return;
  d.classList.add('go');
  setTimeout(()=>{location.href=d.getAttribute('href')},800);
}));
/* sky effects per theme */
const FX={'twilight': 'stars', 'softnight': 'stars', 'dawn': 'butterfly', 'mint': 'butterfly', 'latte': 'birds'};
const MOON={'twilight': 1, 'softnight': 1, 'dawn': 0, 'mint': 0, 'latte': 0};
function fx(){
  const sky=document.getElementById('sky');
  sky.querySelectorAll('.fx').forEach(e=>e.remove());
  const kind=FX[document.body.dataset.theme];
  document.body.classList.toggle('moon',!!MOON[document.body.dataset.theme]);
  const add=(cls,txt,css)=>{const e=document.createElement('span');e.className='fx '+cls;if(txt)e.textContent=txt;Object.assign(e.style,css);sky.appendChild(e);};
  if(kind==='stars') for(let i=0;i<40;i++) add('star','',{left:Math.random()*100+'%',top:Math.random()*40+'%',animationDelay:(Math.random()*2)+'s'});
  if(kind==='petals'||kind==='leaves'){const ch=kind==='petals'?['🌸','🌸','🩷']:['🍁','🍂','🍁'];
    for(let i=0;i<16;i++) add('fall',ch[i%3],{left:Math.random()*100+'%',fontSize:(14+Math.random()*12)+'px',animationDuration:(8+Math.random()*8)+'s',animationDelay:(-Math.random()*14)+'s'});}
  if(kind==='butterfly') for(let i=0;i<4;i++) add('bfly','🦋',{left:(10+Math.random()*75)+'%',top:(48+Math.random()*30)+'%',animationDelay:(-Math.random()*6)+'s'});
}
fx();
const books=[...document.querySelectorAll('.shelves .w rect')].filter(r=>+r.getAttribute('height')>10);
setInterval(()=>{ const b=books[Math.floor(Math.random()*books.length)]; if(!b) return; b.classList.add('peek'); setTimeout(()=>b.classList.remove('peek'),900); },1400);
document.querySelectorAll('.tabs button[data-s]').forEach(b=>{
  b.classList.toggle('on',b.dataset.s===document.body.dataset.sign);
  b.onclick=()=>{document.body.dataset.sign=b.dataset.s;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));};
});
document.querySelectorAll('.tabs button[data-t]').forEach(b=>{
  b.classList.toggle('on',b.dataset.t===document.body.dataset.theme);
  b.onclick=()=>{document.body.dataset.theme=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));fx();};
});
</script>
