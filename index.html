:root{--navy:#1d3557;--stone:#f3e6cc;--stone2:#e8d6b2;--roof:#b0563b}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--navy);overflow-x:hidden;
  background:linear-gradient(180deg,#9fd8ff 0,#d6f0ff 55%,#a8dc8c 55%,#7cc36a 100%)}
a{text-decoration:none;color:inherit}
.sky{position:absolute;inset:0 0 auto 0;height:420px;pointer-events:none;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.95;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:160%;left:15%;top:-70%}.cloud::after{width:40%;height:130%;right:12%;top:-45%}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(110vw)}}
.sun{position:absolute;right:6%;top:26px;width:70px;height:70px;border-radius:50%;background:#ffd34d;box-shadow:0 0 0 10px rgba(255,211,77,.3)}
.sun::before{content:"";position:absolute;left:20px;top:26px;width:6px;height:6px;border-radius:50%;background:#7a5200;box-shadow:24px 0 0 #7a5200}
.sun::after{content:"";position:absolute;left:21px;top:38px;width:28px;height:12px;border:4px solid #7a5200;border-top:none;border-radius:0 0 20px 20px}
.bird{position:absolute;width:22px;height:10px;border:3px solid var(--navy);border-color:var(--navy) transparent transparent transparent;border-radius:50% 50% 0 0;animation:flap 1.2s ease-in-out infinite alternate}
@keyframes flap{to{transform:translateY(-6px) scaleY(.7)}}

.wrap{position:relative;max-width:860px;margin:0 auto;padding:90px 14px 40px}
.scene{position:relative;display:flex;align-items:flex-end;justify-content:center}

/* side decorations */
.tree{position:absolute;bottom:22px;width:96px;z-index:0}
.tree.l{left:-70px}.tree.r{right:-70px}
.lamp{position:absolute;bottom:22px;width:26px;z-index:3}
.lamp.l{left:-14px}.lamp.r{right:-14px}

/* building */
.bld{position:relative;width:100%;z-index:2}
.roof{position:relative;height:110px;margin:0 -28px -4px}
.roof svg{width:100%;height:100%;display:block}
.facade{position:relative;background:var(--stone);border:4px solid var(--navy);border-bottom:none;padding:16px 22px 0;
  background-image:linear-gradient(rgba(176,140,90,.18) 2px,transparent 2px);background-size:100% 30px}
.sign{position:relative;font-family:'Lilita One';text-align:center;font-size:clamp(30px,6vw,52px);background:var(--navy);color:#f6d743;
  border-radius:12px;padding:6px 10px 8px;margin:0 auto 14px;max-width:540px;box-shadow:0 6px 0 #0f2038;letter-spacing:1px}
.sign::before,.sign::after{content:"★";position:absolute;top:50%;transform:translateY(-50%);font-size:.5em;color:#f6d743}
.sign::before{left:16px}.sign::after{right:16px}
.shelves{display:flex;justify-content:space-between;gap:12px;margin:0 6px 16px}
.shelves .w{flex:1;max-width:110px;border:4px solid var(--navy);border-radius:40px 40px 4px 4px;overflow:hidden;background:#fff4d6}
.shelves .w svg{display:block;width:100%}
.shelves .w.mid{flex:0 0 auto;width:auto;max-width:none;border-radius:999px;width:64px;height:64px;align-self:center;background:#cfeaff;display:flex;align-items:center;justify-content:center;font-size:30px}

.doors{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:30px;padding:0 26px}
.col{position:absolute;bottom:0;width:22px;top:-6px;background:linear-gradient(90deg,#fffaf0,#e2cfa8);border:3px solid var(--navy);border-radius:4px}
.col::before{content:"";position:absolute;left:-7px;right:-7px;top:-10px;height:12px;background:#fffaf0;border:3px solid var(--navy);border-radius:3px}
.col.c1{left:-8px}.col.c2{left:calc(50% - 11px)}.col.c3{right:-8px}

.door{position:relative;display:block;text-align:center;padding-bottom:14px;perspective:600px}
.frame{position:relative;display:block;border:5px solid var(--navy);border-radius:140px 140px 6px 6px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 5px #fff}
.frame .sc{display:block;width:100%;height:auto;aspect-ratio:200/140;transition:transform .4s}
.leaf{position:absolute;top:0;bottom:0;width:50%;background:#8d5d31;border:3px solid var(--navy);transition:transform .7s cubic-bezier(.5,0,.3,1);z-index:2;
  background-image:linear-gradient(90deg,transparent 46%,rgba(0,0,0,.12) 46% 54%,transparent 54%),linear-gradient(transparent 45%,rgba(0,0,0,.12) 45% 52%,transparent 52%)}
.leaf.l{left:0;transform-origin:left;border-radius:130px 0 0 0}
.leaf.r{right:0;transform-origin:right;border-radius:0 130px 0 0}
.leaf::after{content:"";position:absolute;top:56%;width:9px;height:9px;border-radius:50%;background:#f6d743;border:2px solid var(--navy)}
.leaf.l::after{right:8px}.leaf.r::after{left:8px}
.opened .leaf.l{transform:rotateY(-105deg)}.opened .leaf.r{transform:rotateY(105deg)}
.door:hover .sc{transform:scale(1.06)}
.door.go .leaf.l{transform:rotateY(-105deg)}.door.go .leaf.r{transform:rotateY(105deg)}
.plaque{display:block;margin-top:10px;background:#fff;border:3px solid var(--navy);border-radius:10px;padding:6px 4px;box-shadow:0 4px 0 rgba(29,53,87,.25)}
