<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jamie's Library</title>
<style>
  :root {
    --bg: #EAF3F8;
    --ink: #14304A;
    --blue: #2B6CB0;
    --sun: #FFC93C;
    --card: #FFFFFF;
    --muted: #5B7189;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Nunito", "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.5;
  }
  header { padding: 44px 20px 20px; text-align: center; }
  h1 {
    margin: 0;
    font-size: clamp(2.2rem, 7vw, 3.4rem);
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  h1 span {
    background: linear-gradient(transparent 62%, var(--sun) 62%);
    padding: 0 6px;
  }
  main { max-width: 680px; margin: 0 auto; padding: 0 20px 72px; }

  /* Search + filter */
  .search {
    width: 100%;
    padding: 16px 18px;
    font: inherit;
    font-size: 1.15rem;
    color: var(--ink);
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 14px;
    box-shadow: 4px 4px 0 var(--ink);
  }
  .search:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .tabs { display: flex; gap: 8px; margin: 18px 0 6px; flex-wrap: wrap; }
  .tab {
    font: inherit;
    font-weight: 700;
    padding: 8px 18px;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--ink);
    border-radius: 999px;
    cursor: pointer;
  }
  .tab[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .tab:focus-visible, .tag:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .count { margin: 10px 2px 0; color: var(--muted); font-size: .95rem; min-height: 1.4em; }

  /* Lists */
  h2 { font-size: 1.6rem; margin: 36px 0 4px; }
  h3 { font-size: 1.05rem; margin: 18px 0 10px; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; }
  li + li { margin-top: 12px; }
  .card {
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 14px;
    box-shadow: 4px 4px 0 var(--ink);
    padding: 14px 18px 14px;
  }
  .card .name { display: block; font-size: 1.12rem; font-weight: 800; }

  /* Quiz buttons */
  .quizzes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  a.quiz {
    display: inline-block;
    min-height: 44px;
    padding: 8px 18px;
    line-height: 26px;
    font-weight: 800;
    color: var(--ink);
    background: var(--sun);
    border: 2px solid var(--ink);
    border-radius: 999px;
    box-shadow: 2px 2px 0 var(--ink);
    text-decoration: none;
    transition: transform .12s, box-shadow .12s;
  }
  a.quiz:hover, a.quiz:focus-visible {
    transform: translate(1px, 1px);
    box-shadow: 1px 1px 0 var(--ink);
  }
  a.quiz:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { a.quiz { transition: none; } }

  /* Grammar keywords */
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag {
    font: inherit;
    font-size: .85rem;
    padding: 2px 10px;
    color: var(--blue);
    background: #EAF3F8;
    border: 1px solid #B9D3E6;
    border-radius: 999px;
    cursor: pointer;
  }
  .tag:hover { background: #D8E9F5; }
  .empty { margin: 40px 0; text-align: center; font-size: 1.1rem; }
</style>
</head>
<body>
<header>
  <h1><span>Jamie's Library</span></h1>
</header>

<main>
  <input id="q" class="search" type="search" placeholder="Search: past perfect, Nate, grade 3…" aria-label="Search worksheets" autocomplete="off">
  <div class="tabs" role="group" aria-label="Filter by type">
    <button class="tab" data-type="all" aria-pressed="true">All</button>
    <button class="tab" data-type="grammar" aria-pressed="false">Grammar</button>
    <button class="tab" data-type="reading" aria-pressed="false">Reading</button>
  </div>
  <div id="count" class="count" aria-live="polite"></div>
  <div id="list"></div>
</main>

<script>
/* ============================================================
   練習卷清單
   一個「故事」或「文法主題」是一筆資料，底下的練習卷用 Quiz 1、Quiz 2… 排列。

   新增同一個故事的新練習卷：在該筆的 quizzes 裡多加一行，編號接下一號。
   新增一個全新的故事／主題：複製整筆 { ... }, 改掉內容。

   - name    : 故事名稱（Reading）或文法主題名稱（Grammar）
   - type    : "grammar" 或 "reading"
   - group   : 只有 grammar 需要，例如 "Tenses"
   - grade   : 只有 reading 需要，填 1 到 6 的數字
   - tags    : 只有 grammar 需要，搜尋與點選用的關鍵字
   - quizzes : { 編號: "檔名" }，檔名要和 GitHub 上的完全一樣（含大小寫）
               編號不要重新排列：給學生做過的 Quiz 1，永遠都是 Quiz 1
   ============================================================ */
const WORKSHEETS = [
  {
    name: "Past Simple vs. Past Perfect",
    type: "grammar", group: "Tenses",
    tags: ["past simple", "past perfect", "tenses", "comparison"],
    quizzes: {
      1: "grammar_past_simple_vs_past_perfect_1.html"
    }
  },
  {
    name: "A Team of Fish",
    type: "reading", grade: 1,
    quizzes: {
      1: "wonders_g1_a_team_of_fish_1.html"
    }
  },
  {
    name: "Journey to Freedom",
    type: "reading", grade: 6,
    quizzes: {
      1: "wonders_g6_journey_to_freedom_1.html"
    }
  }
];

/* Grammar 群組的顯示順序（沒有卷子的群組不會顯示） */
const GRAMMAR_GROUPS = [
  "Tenses", "Nouns & Articles", "Pronouns", "Prepositions",
  "Modals", "Sentences & Questions", "Other"
];

/* ---------- 以下不用改 ---------- */
const $q = document.getElementById("q");
const $list = document.getElementById("list");
const $count = document.getElementById("count");
let currentType = "all";

function haystack(w) {
  return [
    w.name, w.type, w.group || "",
    w.grade ? "grade " + w.grade + " g" + w.grade : "",
    ...(w.tags || [])
  ].join(" ").toLowerCase();
}

function matches(w, words) {
  if (currentType !== "all" && w.type !== currentType) return false;
  const h = haystack(w);
  return words.every(function (x) { return h.indexOf(x) !== -1; });
}

function byName(a, b) { return a.name.localeCompare(b.name, "en", { sensitivity: "base" }); }

function makeCard(w) {
  const li = document.createElement("li");
  li.className = "card";

  const title = document.createElement("span");
  title.className = "name";
  title.textContent = w.name;
  li.appendChild(title);

  const row = document.createElement("div");
  row.className = "quizzes";
  Object.keys(w.quizzes || {}).map(Number).sort(function (a, b) { return a - b; }).forEach(function (n) {
    const a = document.createElement("a");
    a.className = "quiz";
    a.href = w.quizzes[n];
    a.textContent = "Quiz " + n;
    row.appendChild(a);
  });
  li.appendChild(row);

  // 只有 Grammar 的卡片會顯示可點的關鍵字；Reading 只顯示故事名稱和 Quiz 按鈕
  const shown = [];
  if (w.type === "grammar") {
    if (w.group) shown.push(w.group);
    (w.tags || []).forEach(function (t) { shown.push(t); });
  }
  if (shown.length) {
    const box = document.createElement("div");
    box.className = "tags";
    shown.forEach(function (t) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "tag"; b.textContent = t;
      b.addEventListener("click", function () {
        $q.value = t; render(); window.scrollTo({ top: 0, behavior: "smooth" });
      });
      box.appendChild(b);
    });
    li.appendChild(box);
  }
  return li;
}

function addSection(title, subgroups) {
  const filled = subgroups.filter(function (g) { return g.items.length; });
  if (!filled.length) return;
  const h2 = document.createElement("h2"); h2.textContent = title; $list.appendChild(h2);
  filled.forEach(function (g) {
    const h3 = document.createElement("h3"); h3.textContent = g.name; $list.appendChild(h3);
    const ul = document.createElement("ul");
    g.items.sort(byName).forEach(function (w) { ul.appendChild(makeCard(w)); });
    $list.appendChild(ul);
  });
}

function render() {
  const words = $q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const hits = WORKSHEETS.filter(function (w) { return matches(w, words); });
  $list.innerHTML = "";

  const grammar = hits.filter(function (w) { return w.type === "grammar"; });
  const names = GRAMMAR_GROUPS.slice();
  grammar.forEach(function (w) { const g = w.group || "Other"; if (names.indexOf(g) === -1) names.push(g); });
  addSection("Grammar", names.map(function (n) {
    return { name: n, items: grammar.filter(function (w) { return (w.group || "Other") === n; }) };
  }));

  const reading = hits.filter(function (w) { return w.type === "reading"; });
  addSection("Reading", [1, 2, 3, 4, 5, 6].map(function (g) {
    return { name: "Grade " + g, items: reading.filter(function (w) { return w.grade === g; }) };
  }));

  if (!hits.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No worksheets found. Try a shorter word.";
    $list.appendChild(p);
  }
  $count.textContent = hits.length + (hits.length === 1 ? " result" : " results");
}

$q.addEventListener("input", render);
document.querySelectorAll(".tab").forEach(function (btn) {
  btn.addEventListener("click", function () {
    currentType = btn.dataset.type;
    document.querySelectorAll(".tab").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b === btn));
    });
    render();
  });
});
render();
</script>
</body>
</html>
